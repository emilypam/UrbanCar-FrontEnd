server {
    listen 80;

    # Resolver para DNS dinamico de Azure Container Apps
    resolver 168.63.129.16 valid=15s ipv6=off;

    # ── Angular SPA ──────────────────────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # ── auth-service (puerto 80 interno) ─────────────────────────────────────
    location /api/v1/auth {
        proxy_pass         http://auth-service.internal.ambitioushill-8cbf622c.eastus2.azurecontainerapps.io/api/v1/emilypamela/auth;
        proxy_set_header   Host              auth-service.internal.ambitioushill-8cbf622c.eastus2.azurecontainerapps.io;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/usuarios {
