upstream auth_service          { server auth-service:80; }
upstream inventario_service    { server inventario-service:80; }
upstream org_service           { server org-service:80; }
upstream operaciones_service   { server operaciones-service:80; }
upstream financiero_service    { server financiero-service:80; }
upstream mantenimiento_service { server mantenimiento-service:80; }
upstream bus_service           { server bus-service:80; }

server {
    listen 80;

    # ── Angular SPA ───────────────────────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location = /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # ── auth-service (puerto interno 3001, ingress Azure → 80) ───────────────
    # Angular llama: /api/v1/auth/...  y  /api/v1/usuarios/...
    # Backend espera: /api/v1/emilypamela/auth/...
    location /api/v1/auth {
        rewrite ^/api/v1/auth(.*)$ /api/v1/emilypamela/auth$1 break;
        proxy_pass         http://auth_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/usuarios {
        rewrite ^/api/v1/usuarios(.*)$ /api/v1/emilypamela/usuarios$1 break;
        proxy_pass         http://auth_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── inventario-service (puerto interno 3002, ingress Azure → 80) ─────────
    # Angular llama: /api/v1/vehiculos/...  /api/v1/categorias/...  etc.
    location /api/v1/vehiculos {
        rewrite ^/api/v1/vehiculos(.*)$ /api/v1/emilypamela/vehiculos$1 break;
        proxy_pass         http://inventario_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/(marcas|modelos|categorias|extras|tipos-combustible|tipos-transmision|estados-vehiculo) {
        rewrite ^/api/v1/(.*)$ /api/v1/emilypamela/$1 break;
        proxy_pass         http://inventario_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── org-service (puerto interno 3003, ingress Azure → 80) ────────────────
    # Angular llama: /api/v1/ciudades  /api/v1/provincias  /api/v1/empresas  /api/v1/agencias
    location ~ ^/api/v1/(empresas|agencias|provincias|ciudades) {
        rewrite ^/api/v1/(.*)$ /api/v1/emilypamela/$1 break;
        proxy_pass         http://org_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── operaciones-service (puerto interno 3004, ingress Azure → 80) ────────
    location /api/v1/reservas {
        rewrite ^/api/v1/reservas(.*)$ /api/v1/emilypamela/reservas$1 break;
        proxy_pass         http://operaciones_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/alquileres {
        rewrite ^/api/v1/alquileres(.*)$ /api/v1/emilypamela/alquileres$1 break;
        proxy_pass         http://operaciones_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/devoluciones {
        rewrite ^/api/v1/devoluciones(.*)$ /api/v1/emilypamela/devoluciones$1 break;
        proxy_pass         http://operaciones_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/admin {
        rewrite ^/api/v1/admin(.*)$ /api/v1/emilypamela/admin$1 break;
        proxy_pass         http://operaciones_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/(seguros|tarifas|canales-venta|historial|outbox-events) {
        rewrite ^/api/v1/(.*)$ /api/v1/emilypamela/$1 break;
        proxy_pass         http://operaciones_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── financiero-service (puerto interno 3005, ingress Azure → 80) ─────────
    location ~ ^/api/v1/(pagos|facturas) {
        rewrite ^/api/v1/(.*)$ /api/v1/emilypamela/$1 break;
        proxy_pass         http://financiero_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── mantenimiento-service (puerto interno 3006, ingress Azure → 80) ──────
    location ~ ^/api/v1/(mantenimientos|kardex|sistemas-externos) {
        rewrite ^/api/v1/(.*)$ /api/v1/emilypamela/$1 break;
        proxy_pass         http://mantenimiento_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── bus-service (puerto interno 3007, ingress Azure → 80) ────────────────
    location /api/v1/bus {
        rewrite ^/api/v1/bus(.*)$ /api/v1/emilypamela/bus$1 break;
        proxy_pass         http://bus_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
