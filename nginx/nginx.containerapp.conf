server {
    listen 80;

    # Azure Container Apps internal DNS â€” resolves at request time, not startup
    resolver 168.63.129.16 valid=15s ipv6=off;

    # â”€â”€ Angular SPA â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # â”€â”€ auth-service â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    location ~ ^/api/v1/auth {
        set $upstream http://auth-service.internal.ambitioushill-8cbf622c.eastus2.azurecontainerapps.io;
        rewrite ^/api/v1/auth(.*)$ /api/v1/emilypamela/auth$1 break;
        proxy_pass         $upstream;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/usuarios {
        set $upstream http://auth-service.internal.ambitioushill-8cbf622c.eastus2.azurecontainerapps.io;
        rewrite ^/api/v1/usuarios(.*)$ /api/v1/emilypamela/usuarios$1 break;
