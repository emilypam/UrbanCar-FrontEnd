server {
    listen 80;

    # Azure Container Apps internal DNS — resolucion por peticion, no en startup
    resolver 168.63.129.16 valid=30s ipv6=off;

    # ── Angular SPA ───────────────────────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 '{"gateway":"nginx","status":"ok","version":"2.0"}';
        add_header Content-Type application/json;
    }

    # ── auth-service ──────────────────────────────────────────────────────────
    location /api/v1/auth {
        set $svc "auth-service.internal.ambitioushill-8cbf622c.eastus2.azurecontainerapps.io";
        rewrite ^/api/v1/(.*)$ /api/v1/emilypamela/$1 break;
        proxy_pass         http://$svc;
        proxy_set_header   Host              $svc;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/usuarios {
        set $svc "auth-service.internal.ambitioushill-8cbf622c.eastus2.azurecontainerapps.io";
