server {
    listen 80;

    # 168.63.129.16 resuelve FQDNs publicos de Azure correctamente.
    # Usamos los FQDNs externos (sin .internal.) con https + SNI porque
    # el resolver de Azure resuelve .internal. a la IP del LB externo (que
    # solo acepta HTTPS/SNI y rechaza HTTP con la pagina de error 404 de Azure).
    resolver 168.63.129.16 valid=30s ipv6=off;

    # ── Angular SPA ───────────────────────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 '{"gateway":"nginx","status":"ok"}';
        add_header Content-Type application/json;
    }

    # ── auth-service ──────────────────────────────────────────────────────────
    location ~ ^/api/v1/emilypamela/(auth|usuarios) {
        set $svc "auth-service.ambitioushill-8cbf622c.eastus2.azurecontainerapps.io";
        proxy_pass            https://$svc;
        proxy_ssl_server_name on;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $svc;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
    }

    # ── inventario-service ────────────────────────────────────────────────────
    location ~ ^/api/v1/emilypamela/(vehiculos|marcas|modelos|categorias|extras|tipos-combustible|tipos-transmision|estados-vehiculo) {
        set $svc "inventario-service.ambitioushill-8cbf622c.eastus2.azurecontainerapps.io";
