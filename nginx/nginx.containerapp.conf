server {
    listen 80;

    # 127.0.0.11: DNS embebido de Docker/Container Apps, resuelve FQDNs .internal.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Angular SPA ───────────────────────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 '{"gateway":"nginx","status":"ok"}';
        add_header Content-Type application/json;
    }

    # ── auth-service ──────────────────────────────────────────────────────────
    location ~ ^/api/v1/emilypamela/(auth|usuarios) {
        set $svc "auth-service.internal.ambitioushill-8cbf622c.eastus2.azurecontainerapps.io";
        proxy_pass            http://$svc;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $svc;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
    }

    # ── inventario-service ────────────────────────────────────────────────────
    location ~ ^/api/v1/emilypamela/(vehiculos|marcas|modelos|categorias|extras|tipos-combustible|tipos-transmision|estados-vehiculo) {
